name: daily-update

on:
  schedule:
    - cron: "0 21 * * *"  # 毎日 06:00 JST
  workflow_dispatch:
    inputs:
      task:
        description: "daily = 通常の更新 / rejudge = 高適合案件の再判定とモデル比較"
        default: daily
        type: choice
        options: [daily, rejudge, xpost, xverify]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo  # 日付（締切までの日数・下書きのファイル名）を日本時間で扱う
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 取得・AI判定・サイト生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_ANALYSES_PER_RUN: "60"
        run: |
          if [ "${{ inputs.task }}" = "rejudge" ]; then
            python rejudge_compare.py claude-opus-5-5 30 0
          elif [ "${{ inputs.task }}" = "xpost" ] || [ "${{ inputs.task }}" = "xverify" ]; then
            python build_site.py
          else
            python pipeline.py 14
          fi
      - name: X投稿（下書き作成／承認済みの投稿）
        # Xの不調でサイト更新・データ保存が止まらないよう、失敗しても次の手順へ進む
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        # 下書きは毎日作る。投稿は手動の xpost 実行時、または自動投稿を有効化（vars.X_AUTO_POST=1）した後のみ
        run: |
          if [ "${{ inputs.task }}" = "xverify" ]; then python x_post.py verify; exit 0; fi
          if [ "${{ inputs.task }}" != "xpost" ]; then python x_post.py draft; fi
          if [ "${{ inputs.task }}" = "xpost" ] || [ "${{ vars.X_AUTO_POST }}" = "1" ]; then python x_post.py post; fi
      - name: 案件データを保存
        run: |
          git config user.name "nyusatsu-alert-bot"
          git config user.email "nyusatsu-alert-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) daily update"
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
