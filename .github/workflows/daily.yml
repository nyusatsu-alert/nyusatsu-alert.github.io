name: daily-update

on:
  schedule:
    - cron: "0 21 * * *"  # 毎日 06:00 JST
  workflow_dispatch:
    inputs:
      task:
        description: "daily = 通常の更新 / rejudge = 高適合案件の再判定とモデル比較"
        default: daily
        type: choice
        options: [daily, rejudge]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 取得・AI判定・サイト生成
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_ANALYSES_PER_RUN: "60"
        run: |
          if [ "${{ inputs.task }}" = "rejudge" ]; then
            python rejudge_compare.py claude-sonnet-5-5 30 20
          else
            python pipeline.py 14
          fi
      - name: 案件データを保存
        run: |
          git config user.name "nyusatsu-alert-bot"
          git config user.email "nyusatsu-alert-bot@users.noreply.github.com"
          git add data/tenders.json data/usage_log.json data/model_compare_*.json 2>/dev/null || git add data/tenders.json data/usage_log.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F) daily update"
          git push
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
